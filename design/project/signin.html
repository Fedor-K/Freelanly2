<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Freelanly</title>
<link rel="stylesheet" href="app/app.css">
<style>
body { background: var(--bg); min-height: 100vh; }
.center-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px 22px; }
.signin-card {
  width: 100%; max-width: 440px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 40px 36px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 36px rgba(0,0,0,0.06);
}
@media (max-width: 480px) { .signin-card { padding: 32px 24px; } }

.si-logo { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.015em; font-size: 16px; color: var(--ink); margin-bottom: 28px; }
.si-logo-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--acid); display: grid; place-items: center; font-family: 'Geist Mono', monospace; font-weight: 700; font-size: 14px; }

.si-eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 12px; }
.si-title { font-size: 26px; letter-spacing: -0.02em; line-height: 1.15; font-weight: 500; margin: 0 0 8px; }
.si-sub { color: var(--ink-3); font-size: 14px; line-height: 1.5; margin: 0 0 26px; }

.oauth-btn {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line-3);
  border-radius: 11px;
  background: var(--bg-1);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 14px; font-weight: 500;
  transition: all 140ms; cursor: pointer;
}
.oauth-btn:hover { background: var(--bg-2); border-color: var(--ink-3); }
.oauth-btn svg { width: 18px; height: 18px; }

.divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-4); }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.field-label { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; font-family: 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; }
.text-input { width: 100%; padding: 12px 14px; background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 10px; font-size: 14.5px; outline: none; transition: border-color 140ms; }
.text-input:focus { border-color: var(--ink); }
.text-input::placeholder { color: var(--ink-4); }

.primary-btn {
  width: 100%; margin-top: 18px;
  padding: 13px 18px;
  background: var(--acid); color: #000;
  border-radius: 11px;
  font-size: 14.5px; font-weight: 500; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
  transition: transform 120ms;
}
.primary-btn:hover { transform: translateY(-1px); }
.primary-btn .arrow { transition: transform 140ms; }
.primary-btn:hover .arrow { transform: translateX(3px); }

.helper { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.helper b { color: var(--ink); font-weight: 500; }

.signup-line { font-size: 13.5px; color: var(--ink-3); margin-top: 22px; text-align: center; }
.signup-line a { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-3); text-underline-offset: 3px; }
</style>
</head>
<body>

<div class="center-wrap">
  <div class="signin-card">
    <a href="index.html" class="si-logo">
      <span class="si-logo-mark">F</span>
      <span>Freelanly</span>
    </a>

    <div class="si-eyebrow">— Welcome back</div>
    <h1 class="si-title">Sign in to your dashboard.</h1>
    <p class="si-sub">We'll email you a 6-digit code — no password to remember.</p>

    <button class="oauth-btn">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or use email</div>

    <div>
      <label class="field-label">Email</label>
      <input class="text-input" type="email" placeholder="you@inbox.com" autocomplete="email"/>
      <div class="helper">We'll send a code to this address.</div>
    </div>

    <a href="verify.html" class="primary-btn">
      Send 6-digit code
      <span class="arrow">→</span>
    </a>

    <div class="signup-line">New to Freelanly? <a href="signup.html">Create an account</a></div>
  </div>
</div>

</body>
</html>
